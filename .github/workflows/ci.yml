name: CI 

on: 
  push: 
    branches: [main]
  pull_request:

jobs:
  check: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setupuv@v6
        with: 
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check 
        run: uv run diff format --check .

      - name: Test
        run: uv run pytest -q